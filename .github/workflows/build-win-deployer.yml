name: 建置 Windows WSL2 極輕量 Linux 全離線一鍵包

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要打包進 Windows WSL2 全離線一鍵包的 Release 標籤（例如 v3.9-sslf 或 v3.9-sslf-sc）"
        required: true
        default: "v3.9-sslf"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify-source:
    name: 源碼與工具檢查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -p 'test_*.py' -v
      - run: python3 tools/check_public_tree.py
      - name: 編譯純開源 ARM 開機掛勾機器碼 Stub (不含任何 Sony 檔案)
        run: |
          sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabihf
          python3 tools/build_autoexec_hook.py --emit-stub hook-stub.bin
      - uses: actions/upload-artifact@v4
        with:
          name: hook-stub-bin
          path: hook-stub.bin

  build-win-wsl-package:
    name: 建置極輕量 Alpine WSL2 映像與全離線一鍵包
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取得本專案源碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: repo
          persist-credentials: false

      - name: 下載開源 hook-stub.bin
        uses: actions/download-artifact@v4
        with:
          name: hook-stub-bin

      - name: 建置極輕量 Alpine Linux WSL2 rootfs (~20 MB)
        run: |
          mkdir -p stage/offline stage/tools
          bash repo/tools/build_alpine_wsl_rootfs.sh stage/offline/a6400-alpine-wsl.tar.gz hook-stub.bin

      - name: 下載官方簽章離線安裝檔 (完整 WSL2 本體 + Win10 核心 + usbipd-win)
        run: |
          # 1. Microsoft official full WSL2 MSI (Win10 19041+ & Win11 22H2/23H2/24H2 100% offline, ~196 MB)
          curl -fL "https://github.com/microsoft/WSL/releases/download/2.4.13/wsl.2.4.13.0.x64.msi" \
            -o stage/offline/wsl.2.4.13.0.x64.msi

          # 2. Microsoft official legacy Win10 WSL2 kernel update (~16 MB fallback)
          curl -fL "https://wslstorestorage.blob.core.windows.net/wslblob/wsl_update_x64.msi" \
            -o stage/offline/wsl_update_x64.msi

          # 3. Official signed dorssel/usbipd-win x64 MSI (~4.3 MB)
          USBIPD_URL="$(python3 - <<'PY'
          import urllib.request, json
          req = urllib.request.Request(
              "https://api.github.com/repos/dorssel/usbipd-win/releases/latest",
              headers={"Accept": "application/vnd.github+json", "User-Agent": "A6400-CI"},
          )
          rel = json.loads(urllib.request.urlopen(req).read().decode())
          for a in rel["assets"]:
              if a["name"].endswith(".msi") and "x64" in a["name"].lower():
                  print(a["browser_download_url"])
                  break
          PY
          )"
          test -n "$USBIPD_URL"
          curl -fL "$USBIPD_URL" -o stage/offline/usbipd-win.msi
          ls -lh stage/offline/

      - name: 整合 Release V3.9 SSLF 雙語開機包與 Windows 一鍵腳本
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess, zipfile
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          stage = Path("stage")

          def fetch_pkg(tag_name, dest_dir):
              res = subprocess.run(
                  ["gh", "release", "view", tag_name, "--repo", repo, "--json", "assets"],
                  capture_output=True, text=True, check=False,
              )
              if res.returncode != 0:
                  return False
              assets = json.loads(res.stdout).get("assets", [])
              asset = next(
                  (a for a in assets if a["name"].startswith("A6400-V3.9") and "OneClick" in a["name"] and "Win-" not in a["name"]),
                  None,
              )
              if not asset:
                  return False
              dl = Path(f"dl_{tag_name}")
              ext = Path(f"ext_{tag_name}")
              dl.mkdir(exist_ok=True)
              ext.mkdir(exist_ok=True)
              subprocess.run(
                  ["gh", "release", "download", tag_name, "--repo", repo, "--pattern", asset["name"], "-D", str(dl)],
                  check=True,
              )
              with zipfile.ZipFile(dl / asset["name"], "r") as zf:
                  zf.extractall(ext)
              pkg_dir = next((p for p in ext.rglob("local-boot-package") if p.is_dir()), None)
              if not pkg_dir:
                  raise RuntimeError(f"local-boot-package not found in {tag_name}")
              shutil.copytree(pkg_dir, dest_dir)
              return True

          if tag == "v3.9-sslf-sc":
              assert fetch_pkg("v3.9-sslf-sc", stage / "local-boot-package"), "Missing v3.9-sslf-sc"
          else:
              assert fetch_pkg(tag, stage / "local-boot-package-tc"), f"Missing {tag}"
              fetch_pkg("v3.9-sslf-sc", stage / "local-boot-package-sc")

          # Copy pure-CMD deployer (UTF-8 no BOM + CRLF) + watcher + PS1 backup
          for fn in ("wsl_deploy.cmd", "usbipd_watch.cmd"):
              txt = Path(f"repo/tools/{fn}").read_text(encoding="utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
              (stage / "tools" / fn).write_bytes(txt.replace("\n", "\r\n").encode("utf-8"))
          ps_txt = Path("repo/tools/wsl_deploy.ps1").read_text(encoding="utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
          (stage / "tools" / "wsl_deploy.ps1").write_bytes(b"\xef\xbb\xbf" + ps_txt.replace("\n", "\r\n").encode("utf-8"))

          # Also bundle offline FAQ inside the ZIP
          faq_src = Path("repo/docs/WINDOWS-WSL2-FAQ.md")
          if faq_src.exists():
              faq_txt = faq_src.read_text(encoding="utf-8").replace("\r\n", "\n").replace("\n", "\r\n")
              (stage / "常見問題與排錯指南.txt").write_bytes(b"\xef\xbb\xbf" + faq_txt.encode("utf-8"))

          # Write 100% pure-ASCII .bat launchers that elevate native CMD directly (fast, zero PS1 runtime overhead)
          def write_bat(name, cmd_action):
              content = "\r\n".join([
                  "@echo off",
                  "fltmc >nul 2>&1",
                  "if %errorlevel% equ 0 goto :run",
                  'set "A6400_DIR=%~dp0"',
                  f'powershell -NoProfile -Command "$d=$env:A6400_DIR.TrimEnd([char]92); Start-Process cmd.exe -Verb RunAs -ArgumentList (\'/k cd /d \' + [char]34 + $d + [char]34 + \' && chcp 65001 >nul && call tools\\wsl_deploy.cmd {cmd_action}\')" >nul 2>&1',
                  "if %errorlevel% neq 0 (",
                  '  echo [!] Auto-elevation failed. Please right-click this .bat and choose "Run as administrator".',
                  "  pause",
                  ")",
                  "exit /b",
                  ":run",
                  "chcp 65001 >nul",
                  'cd /d "%~dp0"',
                  f'call "tools\\wsl_deploy.cmd" {cmd_action}',
                  "echo.",
                  "pause",
                  "",
              ])
              raw = content.encode("ascii")
              (stage / name).write_bytes(raw)

          write_bat("一鍵開始安裝.bat", "install")
          write_bat("一鍵回滾還原原廠.bat", "rollback")
          write_bat("一鍵抓取相機Log診斷.bat", "diag")
          write_bat("一鍵清理WSL環境.bat", "cleanup")

          readme = "\r\n".join([
              "================================================================",
              "  Sony A6400 / A6100 — V3.9 SSLF Windows WSL2 極輕量全離線一鍵包",
              "================================================================",
              "",
              "【為什麼改用 WSL2 極輕量 Linux 全離線版？】",
              "  - 完全不需 Zadig、不需安裝 libusb-win32、不累積 oemXX.inf！",
              "  - 使用微軟簽章官方 usbipd-win + 極輕量 Alpine Linux (~20 MB) 離線部署，",
              "    免疫 Windows 11 記憶體完整性（核心隔離）與驅動衝突。",
              "  - 內附完整微軟官方簽章 WSL2 本體 (wsl.2.4.13.0.x64.msi)、Win10 核心",
              "    (wsl_update_x64.msi) 與 usbipd-win.msi，Win10 / Win11 24H2 皆免翻牆、",
              "    100% 斷網即可開箱使用！",
              "  - 刷完自動解除 USB 透傳，拔線即為正常 Windows 讀卡機，免還原驅動！",
              "",
              "【事前準備】",
              "  1. 把這個 ZIP 完整解壓縮到電腦資料夾（勿在壓縮檔內直接雙擊）。",
              "  2. 相機設定：",
              "     - 系統語言：繁體中文版設為「繁體中文」，簡體中文版設為「简体中文」",
              "     - MENU -> 設定4 -> USB 連線 = 大容量儲存",
              "     - MENU -> 設定4 -> USB LUN 設定 = 多重",
              "  3. 記憶卡最上層建好空資料夾：/A6400/TEST/",
              "",
              "【開始安裝（開箱即用）】",
              "  1. 用可傳資料的 Micro-USB 線連接開機中的相機，靜置 8 秒。",
              "  2. 雙擊「一鍵開始安裝.bat」（跳出系統管理員權限視窗請按「是」）。",
              "  3. 若電腦從未啟用過 WSL2，腳本會自動離線開啟並提示重開機 1 次；",
              "     重開機後再雙擊「一鍵開始安裝.bat」即可直接一路刷完！",
              "  4. 刷完後若不想保留微型 Linux，可雙擊「一鍵清理WSL環境.bat」秒刪。",
              "",
              "【裝完後冷開機喚出選單】",
              "  1. 拔掉 USB 線 -> 關機 -> 取出電池等 10 秒 -> 裝回再開機。",
              "  2. 開機等待 35~40 秒 -> 輕觸螢幕並鬆開一次 -> 等 2 秒 ->",
              "     長按「MENU + 放大鏡」2 秒即可叫出膠片選單！",
              "",
          ])
          (stage / "README-Windows使用說明.txt").write_bytes(b"\xef\xbb\xbf" + readme.encode("utf-8"))

          zip_name = f"A6400-A6100-{tag}-Win-WSL-Offline.zip"
          with zipfile.ZipFile(zip_name, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for p in sorted(stage.rglob("*")):
                  if p.is_file():
                      arc = f"A6400-A6100-{tag}-Win-WSL-Offline/{p.relative_to(stage).as_posix()}"
                      comp = zipfile.ZIP_STORED if p.suffix.lower() in (".msi", ".gz") else zipfile.ZIP_DEFLATED
                      zf.write(p, arc, compress_type=comp)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ZIP_NAME={zip_name}\n")
          print("BUILT_ZIP:", zip_name, Path(zip_name).stat().st_size)
          PY

      - name: 上傳建置產物 (Workflow Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: 附加至 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$TAG" "$ZIP_NAME" --repo ${{ github.repository }} --clobber
